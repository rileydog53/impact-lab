name: CI
# Free GitHub-hosted macOS runners (macos-15, Apple silicon, 3 vCPU / 7 GB) are free only for PUBLIC repos.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job: build the Swift package once, then run every check as its own step on the same runner.
  # Each check step uses if: always() so one failure does not hide the rest; any failure fails the job.
  ci:
    name: build and checks
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-build-${{ runner.os }}-${{ hashFiles('Package.swift', 'Sources/**') }}
          restore-keys: spm-build-${{ runner.os }}-
      - name: Toolchain
        run: swift --version
      - name: Build (release)
        id: build
        # shell: bash turns on pipefail, so a failed compile fails this step instead of passing through tee.
        shell: bash
        run: swift build -c release 2>&1 | tee build.log
      - name: Prepare tools
        id: prep
        # ImpactRegression also goes where tests/regression/run.py looks for it, so --skip-build works.
        run: |
          mkdir -p ci-out .build-regression/release
          cp .build/release/ImpactRegression .build-regression/release/ImpactRegression
          echo "$PWD/.build/release" >> "$GITHUB_PATH"
      - name: "build + replay + materials: ImpactCheck --legacy-replay check docs/legacy-replay-baseline.txt"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        run: |
          start=$(date +%s); status=0
          ImpactCheck --legacy-replay check docs/legacy-replay-baseline.txt > "ci-out/ImpactCheck___legacy_replay_check_docs_legacy_replay_baselin.log" 2>&1 || status=$?
          echo "ImpactCheck --legacy-replay check docs/legacy-replay-baseline.txt: $(( $(date +%s) - start )) s (exit $status)" | tee -a ci-out/timings.txt
          tail -40 "ci-out/ImpactCheck___legacy_replay_check_docs_legacy_replay_baselin.log"
          exit $status
      - name: "build + replay + materials: ImpactCheck --assembly-replay"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        run: |
          start=$(date +%s); status=0
          ImpactCheck --assembly-replay > "ci-out/ImpactCheck___assembly_replay.log" 2>&1 || status=$?
          echo "ImpactCheck --assembly-replay: $(( $(date +%s) - start )) s (exit $status)" | tee -a ci-out/timings.txt
          tail -40 "ci-out/ImpactCheck___assembly_replay.log"
          exit $status
      - name: "build + replay + materials: ImpactCheck --materials"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        run: |
          start=$(date +%s); status=0
          ImpactCheck --materials > "ci-out/ImpactCheck___materials.log" 2>&1 || status=$?
          echo "ImpactCheck --materials: $(( $(date +%s) - start )) s (exit $status)" | tee -a ci-out/timings.txt
          tail -40 "ci-out/ImpactCheck___materials.log"
          exit $status
      - name: "build + replay + materials: ImpactCheck --metal-profiles"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        run: |
          start=$(date +%s); status=0
          ImpactCheck --metal-profiles > "ci-out/ImpactCheck___metal_profiles.log" 2>&1 || status=$?
          echo "ImpactCheck --metal-profiles: $(( $(date +%s) - start )) s (exit $status)" | tee -a ci-out/timings.txt
          tail -40 "ci-out/ImpactCheck___metal_profiles.log"
          exit $status
      - name: "fracture guard + spall + bulk viscosity: ImpactCheck --fracture-guard"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        run: |
          start=$(date +%s); status=0
          ImpactCheck --fracture-guard > "ci-out/ImpactCheck___fracture_guard.log" 2>&1 || status=$?
          echo "ImpactCheck --fracture-guard: $(( $(date +%s) - start )) s (exit $status)" | tee -a ci-out/timings.txt
          tail -40 "ci-out/ImpactCheck___fracture_guard.log"
          exit $status
      - name: "fracture guard + spall + bulk viscosity: ImpactCheck --spall"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        run: |
          start=$(date +%s); status=0
          ImpactCheck --spall > "ci-out/ImpactCheck___spall.log" 2>&1 || status=$?
          echo "ImpactCheck --spall: $(( $(date +%s) - start )) s (exit $status)" | tee -a ci-out/timings.txt
          tail -40 "ci-out/ImpactCheck___spall.log"
          exit $status
      - name: "fracture guard + spall + bulk viscosity: ImpactCheck --bulk-viscosity"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        run: |
          start=$(date +%s); status=0
          ImpactCheck --bulk-viscosity > "ci-out/ImpactCheck___bulk_viscosity.log" 2>&1 || status=$?
          echo "ImpactCheck --bulk-viscosity: $(( $(date +%s) - start )) s (exit $status)" | tee -a ci-out/timings.txt
          tail -40 "ci-out/ImpactCheck___bulk_viscosity.log"
          exit $status
      - name: "fracture guard + spall + bulk viscosity: ImpactCheck --plasticity"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        run: |
          start=$(date +%s); status=0
          ImpactCheck --plasticity > "ci-out/ImpactCheck___plasticity.log" 2>&1 || status=$?
          echo "ImpactCheck --plasticity: $(( $(date +%s) - start )) s (exit $status)" | tee -a ci-out/timings.txt
          tail -40 "ci-out/ImpactCheck___plasticity.log"
          exit $status
      - name: "presets: ImpactCheck --showcases"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 15
        shell: bash
        run: |
          start=$(date +%s); status=0
          ImpactCheck --showcases > "ci-out/ImpactCheck___showcases.log" 2>&1 || status=$?
          echo "ImpactCheck --showcases: $(( $(date +%s) - start )) s (exit $status)" | tee -a ci-out/timings.txt
          tail -40 "ci-out/ImpactCheck___showcases.log"
          exit $status
      - name: "fracture: ImpactCheck --outline-fracture quick"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        run: |
          start=$(date +%s); status=0
          ImpactCheck --outline-fracture quick > "ci-out/ImpactCheck___outline_fracture_quick.log" 2>&1 || status=$?
          echo "ImpactCheck --outline-fracture quick: $(( $(date +%s) - start )) s (exit $status)" | tee -a ci-out/timings.txt
          tail -40 "ci-out/ImpactCheck___outline_fracture_quick.log"
          exit $status
      - name: "locking + laminate: ImpactCheck --locking"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        run: |
          start=$(date +%s); status=0
          ImpactCheck --locking > "ci-out/ImpactCheck___locking.log" 2>&1 || status=$?
          echo "ImpactCheck --locking: $(( $(date +%s) - start )) s (exit $status)" | tee -a ci-out/timings.txt
          tail -40 "ci-out/ImpactCheck___locking.log"
          exit $status
      - name: "locking + laminate: ImpactCheck --layered-bodies quick"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        run: |
          start=$(date +%s); status=0
          ImpactCheck --layered-bodies quick > "ci-out/ImpactCheck___layered_bodies_quick.log" 2>&1 || status=$?
          echo "ImpactCheck --layered-bodies quick: $(( $(date +%s) - start )) s (exit $status)" | tee -a ci-out/timings.txt
          tail -40 "ci-out/ImpactCheck___layered_bodies_quick.log"
          exit $status
      - name: "lab examples + gravity: ImpactCheck --lab-examples"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        run: |
          start=$(date +%s); status=0
          ImpactCheck --lab-examples > "ci-out/ImpactCheck___lab_examples.log" 2>&1 || status=$?
          echo "ImpactCheck --lab-examples: $(( $(date +%s) - start )) s (exit $status)" | tee -a ci-out/timings.txt
          tail -40 "ci-out/ImpactCheck___lab_examples.log"
          exit $status
      - name: "lab examples + gravity: ImpactCheck --supports-gravity"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        run: |
          start=$(date +%s); status=0
          ImpactCheck --supports-gravity > "ci-out/ImpactCheck___supports_gravity.log" 2>&1 || status=$?
          echo "ImpactCheck --supports-gravity: $(( $(date +%s) - start )) s (exit $status)" | tee -a ci-out/timings.txt
          tail -40 "ci-out/ImpactCheck___supports_gravity.log"
          exit $status
      - name: "lab examples + gravity: ImpactCheck --workshop-improvements"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        run: |
          start=$(date +%s); status=0
          ImpactCheck --workshop-improvements > "ci-out/ImpactCheck___workshop_improvements.log" 2>&1 || status=$?
          echo "ImpactCheck --workshop-improvements: $(( $(date +%s) - start )) s (exit $status)" | tee -a ci-out/timings.txt
          tail -40 "ci-out/ImpactCheck___workshop_improvements.log"
          exit $status
      - name: "test machine + scene documents: ImpactCheck --test-machine"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        run: |
          start=$(date +%s); status=0
          ImpactCheck --test-machine > "ci-out/ImpactCheck___test_machine.log" 2>&1 || status=$?
          echo "ImpactCheck --test-machine: $(( $(date +%s) - start )) s (exit $status)" | tee -a ci-out/timings.txt
          tail -40 "ci-out/ImpactCheck___test_machine.log"
          exit $status
      - name: "test machine + plate impact: ImpactCheck --plate-impact"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        run: |
          start=$(date +%s); status=0
          ImpactCheck --plate-impact > "ci-out/ImpactCheck___plate_impact.log" 2>&1 || status=$?
          echo "ImpactCheck --plate-impact: $(( $(date +%s) - start )) s (exit $status)" | tee -a ci-out/timings.txt
          tail -40 "ci-out/ImpactCheck___plate_impact.log"
          exit $status
      - name: "test machine + plate impact: ImpactCheck --taylor-trend"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        run: |
          start=$(date +%s); status=0
          ImpactCheck --taylor-trend > "ci-out/ImpactCheck___taylor_trend.log" 2>&1 || status=$?
          echo "ImpactCheck --taylor-trend: $(( $(date +%s) - start )) s (exit $status)" | tee -a ci-out/timings.txt
          tail -40 "ci-out/ImpactCheck___taylor_trend.log"
          exit $status
      - name: "test machine + plate impact: ImpactCheck --bend-rig quick"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        run: |
          start=$(date +%s); status=0
          ImpactCheck --bend-rig quick > "ci-out/ImpactCheck___bend_rig_quick.log" 2>&1 || status=$?
          echo "ImpactCheck --bend-rig quick: $(( $(date +%s) - start )) s (exit $status)" | tee -a ci-out/timings.txt
          tail -40 "ci-out/ImpactCheck___bend_rig_quick.log"
          exit $status
      - name: "test machine + scene documents: ImpactCheck --scene-documents"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        run: |
          start=$(date +%s); status=0
          ImpactCheck --scene-documents > "ci-out/ImpactCheck___scene_documents.log" 2>&1 || status=$?
          echo "ImpactCheck --scene-documents: $(( $(date +%s) - start )) s (exit $status)" | tee -a ci-out/timings.txt
          tail -40 "ci-out/ImpactCheck___scene_documents.log"
          exit $status
      - name: "headless runner: ImpactCheck run docs/scene-examples/linked-chain.json"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        run: |
          start=$(date +%s); status=0
          ImpactCheck run docs/scene-examples/linked-chain.json --out ci-out/headless/linked-chain --timeout 600 > "ci-out/ImpactCheck_run_docs_scene_examples_linked_chain_json___out_.log" 2>&1 || status=$?
          echo "ImpactCheck run docs/scene-examples/linked-chain.json --out ci-out/headless/linked-chain --timeout 600: $(( $(date +%s) - start )) s (exit $status)" | tee -a ci-out/timings.txt
          tail -40 "ci-out/ImpactCheck_run_docs_scene_examples_linked_chain_json___out_.log"
          exit $status
      - name: "headless runner: ImpactCheck run docs/scene-examples/metal-plate-impact.json"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        run: |
          start=$(date +%s); status=0
          ImpactCheck run docs/scene-examples/metal-plate-impact.json --out ci-out/headless/metal-plate-impact --timeout 600 > "ci-out/ImpactCheck_run_docs_scene_examples_metal_plate_impact_json_.log" 2>&1 || status=$?
          echo "ImpactCheck run docs/scene-examples/metal-plate-impact.json --out ci-out/headless/metal-plate-impact --timeout 600: $(( $(date +%s) - start )) s (exit $status)" | tee -a ci-out/timings.txt
          tail -40 "ci-out/ImpactCheck_run_docs_scene_examples_metal_plate_impact_json_.log"
          exit $status
      - name: "headless runner: ImpactCheck run docs/showcase/brittle-tile-fracture.json"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        run: |
          start=$(date +%s); status=0
          ImpactCheck run docs/showcase/brittle-tile-fracture.json --out ci-out/headless/brittle-tile-fracture --timeout 600 > "ci-out/ImpactCheck_run_docs_showcase_brittle_tile_fracture_json___o.log" 2>&1 || status=$?
          echo "ImpactCheck run docs/showcase/brittle-tile-fracture.json --out ci-out/headless/brittle-tile-fracture --timeout 600: $(( $(date +%s) - start )) s (exit $status)" | tee -a ci-out/timings.txt
          tail -40 "ci-out/ImpactCheck_run_docs_showcase_brittle_tile_fracture_json___o.log"
          exit $status
      - name: "headless runner: VTK export check"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 15
        shell: bash
        run: |
          ImpactCheck run docs/scene-examples/metal-plate-impact.json --out ci-out/headless/vtk-metal-plate-impact --timeout 600 --vtk
          python3 tests/vtk/check_vtk.py ci-out/headless/vtk-metal-plate-impact
      - name: "regression suite: python3 tests/regression/run.py"
        if: always() && steps.prep.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        run: |
          start=$(date +%s); status=0
          python3 tests/regression/run.py --out ci-out/regression --skip-build > "ci-out/python3_tests_regression_run_py___out_ci_out_regression___sk.log" 2>&1 || status=$?
          echo "python3 tests/regression/run.py --out ci-out/regression --skip-build: $(( $(date +%s) - start )) s (exit $status)" | tee -a ci-out/timings.txt
          tail -40 "ci-out/python3_tests_regression_run_py___out_ci_out_regression___sk.log"
          exit $status
      - name: Timings
        if: always()
        run: '[ -f ci-out/timings.txt ] && cat ci-out/timings.txt >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            build.log
            ci-out/
            **/*.csv
            !.build/**
          if-no-files-found: ignore
