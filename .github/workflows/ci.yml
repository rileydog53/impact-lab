name: CI
# Free GitHub-hosted macOS runners (macos-15, Apple silicon, 3 vCPU / 7 GB) are free only for PUBLIC repos.
on:
  workflow_dispatch:
    inputs:
      mac:
        description: Run on Joseph's Mac runner (testing)
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Picks where the full build runs: Joseph's Mac (label impactlab-mac) when it is online and free, else GitHub-hosted macOS.
  # Fork PRs always go to GitHub (they get no secrets and never touch the Mac). Repo variable IMPACTLAB_MAC=off forces GitHub.
  where:
    name: pick runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Choose test tier
        id: tier
        # docs: only docs/text changed -> no build. quick: only the app UI (Sources/ImpactLab, which no check depends on)
        # plus docs -> build + quick checks. Anything else, and manual runs -> full suite.
        # PRs: merge commit vs its first parent (current main; base.sha can be stale once main moves).
        # Pushes to main: everything since the previous main commit, so docs-only merges skip the rerun.
        shell: bash
        run: |
          tier=full; files=""
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
          elif [ "${{ github.event_name }}" = push ] && ! echo "${{ github.event.before }}" | grep -q '^0*$'; then
            files=$(git diff --name-only "${{ github.event.before }}" HEAD) || files="(diff failed)"
          fi
          if [ -n "$files" ]; then
            nondoc=$(echo "$files" | grep -Ev '^(docs/|research/|reports/)|\.md$|^LICENSE' || true)
            if [ -z "$nondoc" ]; then tier=docs
            elif [ -z "$(echo "$nondoc" | grep -v '^Sources/ImpactLab/' || true)" ]; then tier=quick; fi
          fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"; echo "Test tier: $tier" | tee -a "$GITHUB_STEP_SUMMARY"
      - id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.STATUS_TOKEN }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          FORCE_MAC: ${{ inputs.mac || false }}
          SWITCH: ${{ vars.IMPACTLAB_MAC }}
        run: |
          hosted='"macos-15"'; mac='["self-hosted","impactlab-mac"]'; pick=$hosted; why="default"
          if [ "$FORK" = true ]; then why="fork PR"
          elif [ "$FORCE_MAC" = true ]; then pick=$mac; why="manual run asked for the Mac"
          elif [ "$SWITCH" = off ]; then why="IMPACTLAB_MAC=off"
          elif [ -z "$GH_TOKEN" ]; then why="no STATUS_TOKEN secret"
          else
            status=$(gh api "repos/${{ github.repository }}/actions/runners" --jq '.runners[]|select(.name=="impactlab-mac")|"\(.status) \(.busy)"' 2>/dev/null || echo error)
            # Free Mac takes the run; a busy or offline Mac sends it to GitHub at once instead of queueing.
            if [ "$status" = "online false" ]; then pick=$mac; why="Mac free"; else why="Mac: ${status:-not found}"; fi
          fi
          echo "runs_on=$pick" >> "$GITHUB_OUTPUT"
          echo "Runner: $pick ($why)" | tee -a "$GITHUB_STEP_SUMMARY"

  # The checks split into 3 shards that run side by side (balanced in scripts/ci-checks.sh).
  # Shard 1 goes to Joseph's Mac when it is free; the others always use GitHub-hosted macOS.
  checks:
    name: checks shard ${{ matrix.shard }}
    needs: where
    if: needs.where.outputs.tier != 'docs'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ${{ matrix.shard == 1 && fromJSON(needs.where.outputs.runs_on) || 'macos-15' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        # The Mac has little disk; skip the build cache there.
        if: runner.environment == 'github-hosted'
        with:
          path: .build
          key: spm-build-${{ runner.os }}-${{ hashFiles('Package.swift', 'Sources/**') }}
          restore-keys: spm-build-${{ runner.os }}-
      - name: Keep build cache between Mac jobs
        if: runner.environment != 'github-hosted'
        run: |
          mkdir -p "$HOME/actions-runner/spm-cache"
          rm -rf .build && ln -s "$HOME/actions-runner/spm-cache" .build
      - name: Toolchain
        run: swift --version
      - name: Build (release)
        id: build
        # shell: bash turns on pipefail, so a failed compile fails this step instead of passing through tee.
        shell: bash
        run: swift build -c release 2>&1 | tee build.log
      - name: Prepare tools
        id: prep
        # ImpactRegression also goes where tests/regression/run.py looks for it, so --skip-build works.
        run: |
          mkdir -p ci-out .build-regression/release
          cp .build/release/ImpactRegression .build-regression/release/ImpactRegression
          echo "$PWD/.build/release" >> "$GITHUB_PATH"
      - name: "All checks (scripts/ci-checks.sh; CI_PARALLEL at a time, logs in ci-out/)"
        if: steps.prep.outcome == 'success'
        timeout-minutes: 120
        shell: bash
        env:
          # Joseph's Mac (10 cores, passively cooled): 3 at a time. GitHub-hosted: one at a time, as before.
          CI_TIER: ${{ needs.where.outputs.tier }}
          CI_SHARDS: 3
          CI_SHARD: ${{ matrix.shard }}
          CI_PARALLEL: ${{ runner.environment == 'github-hosted' && '1' || '3' }}
        run: scripts/ci-checks.sh
      - name: Timings
        if: always()
        run: '[ -f ci-out/timings.txt ] && cat ci-out/timings.txt >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-shard-${{ matrix.shard }}
          path: |
            build.log
            ci-out/
            **/*.csv
            !.build/**
          if-no-files-found: ignore

  # One summary check with the old name, green when every shard passed (or docs-only skipped them).
  ci:
    name: build and checks
    needs: [where, checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "Tier: ${{ needs.where.outputs.tier }}, shards: ${{ needs.checks.result }}"
          [ "${{ needs.where.result }}" = success ] || exit 1
          case "${{ needs.checks.result }}" in success|skipped) exit 0;; *) exit 1;; esac
